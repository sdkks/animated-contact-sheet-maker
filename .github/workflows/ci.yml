name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mediainfo

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Clippy (all targets)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --locked

      - name: Install smoke test
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/acsm-install"
          "$RUNNER_TEMP/acsm-install/bin/acsm" --help

  # Build on native x86_64, not under local architecture emulation.
  musl:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-musl-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-musl-

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build standalone musl CLI
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/acsm acsm-linux-x86_64-musl
          strip acsm-linux-x86_64-musl

      - name: Verify static linkage and Alpine runtime
        run: |
          readelf -l acsm-linux-x86_64-musl > "$RUNNER_TEMP/program-headers.txt"
          readelf -d acsm-linux-x86_64-musl > "$RUNNER_TEMP/dynamic-section.txt"
          if grep -q INTERP "$RUNNER_TEMP/program-headers.txt" || grep -q NEEDED "$RUNNER_TEMP/dynamic-section.txt"; then
            echo 'musl CLI must not require a dynamic loader or shared libraries' >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/input:ro" alpine:3.19 sh -ec '
            /input/acsm-linux-x86_64-musl --help
            apk add --no-cache ffmpeg mediainfo
            export ACSM_CONFIG=/tmp/acsm.toml
            /input/acsm-linux-x86_64-musl probe /input/tests/fixtures/sample.mp4
            /input/acsm-linux-x86_64-musl sheet /input/tests/fixtures/sample.mp4 --cols 2 --rows 1 -o /tmp/smoke
            test -n "$(find /tmp/smoke -type f -size +0c)"
          '

      - name: Checksum artifact
        run: sha256sum acsm-linux-x86_64-musl > acsm-linux-x86_64-musl.sha256

      - name: Upload downloadable musl CLI
        uses: actions/upload-artifact@v4
        with:
          name: acsm-linux-x86_64-musl
          path: |
            acsm-linux-x86_64-musl
            acsm-linux-x86_64-musl.sha256
          if-no-files-found: error

  # Lint and link on Windows: MSVC linking (static C runtime) and
  # cfg(windows) code are invisible to the Linux job.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-windows-

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Clippy (all targets)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build acsm
        run: cargo build --locked
