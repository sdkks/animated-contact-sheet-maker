name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            cli-name: macos-universal
            cli-lipo: "true"
          - os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            cli-name: windows-x86_64
            cli-target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            rust-targets: aarch64-pc-windows-msvc
            cli-name: windows-aarch64
            cli-target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            cli-name: linux-x86_64
            cli-target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-musl
            cli-name: linux-x86_64-musl
            cli-target: x86_64-unknown-linux-musl

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.os }}-${{ matrix.cli-name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.os }}-${{ matrix.cli-name }}-

      - name: Install musl build tools
        if: matrix.cli-target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Import Apple Developer certificate (macOS only)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build acsm (lipo universal, macOS only)
        if: matrix.cli-lipo == 'true'
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/acsm \
            target/aarch64-apple-darwin/release/acsm \
            target/x86_64-apple-darwin/release/acsm
          strip target/universal-apple-darwin/release/acsm

      - name: Build acsm (single target)
        if: matrix.cli-lipo != 'true'
        run: cargo build --locked --release --target ${{ matrix.cli-target }}

      - name: Codesign + notarize acsm (macOS)
        if: matrix.cli-lipo == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          bin="target/universal-apple-darwin/release/acsm"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          codesign --verify --verbose "$bin"
          # Notarize via zip — notarytool requires a container, not a raw Mach-O.
          ditto -c -k --keepParent "$bin" acsm-notarize.zip
          xcrun notarytool submit acsm-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm acsm-notarize.zip

      - name: Strip CLI (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: strip target/${{ matrix.cli-target }}/release/acsm

      - name: Prepare CLI artifact
        shell: bash
        run: |
          if [ "${{ matrix.cli-lipo }}" = "true" ]; then
            src="target/universal-apple-darwin/release/acsm"
            ext=""
          elif [ "$RUNNER_OS" = "Windows" ]; then
            src="target/${{ matrix.cli-target }}/release/acsm.exe"
            ext=".exe"
          else
            src="target/${{ matrix.cli-target }}/release/acsm"
            ext=""
          fi
          dst="acsm-${{ matrix.cli-name }}${ext}"
          cp "$src" "$dst"
          echo "CLI_ARTIFACT=$dst" >> "$GITHUB_ENV"

      - name: Verify musl static linkage and Alpine runtime
        if: matrix.cli-target == 'x86_64-unknown-linux-musl'
        run: |
          readelf -l "$CLI_ARTIFACT" > "$RUNNER_TEMP/program-headers.txt"
          readelf -d "$CLI_ARTIFACT" > "$RUNNER_TEMP/dynamic-section.txt"
          if grep -q INTERP "$RUNNER_TEMP/program-headers.txt" || grep -q NEEDED "$RUNNER_TEMP/dynamic-section.txt"; then
            echo 'musl CLI must not require a dynamic loader or shared libraries' >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/input:ro" alpine:3.19 sh -ec '
            /input/acsm-linux-x86_64-musl --help
            apk add --no-cache ffmpeg mediainfo
            export ACSM_CONFIG=/tmp/acsm.toml
            /input/acsm-linux-x86_64-musl probe /input/tests/fixtures/sample.mp4
            /input/acsm-linux-x86_64-musl sheet /input/tests/fixtures/sample.mp4 --cols 2 --rows 1 -o /tmp/smoke
            test -n "$(find /tmp/smoke -type f -size +0c)"
          '

      - name: Checksum CLI artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            sha=$(certutil -hashfile "$CLI_ARTIFACT" SHA256 | sed -n '2p' | tr -d ' \r' | tr '[:upper:]' '[:lower:]')
            printf '%s  %s\n' "$sha" "$CLI_ARTIFACT" > "${CLI_ARTIFACT}.sha256"
          else
            shasum -a 256 "$CLI_ARTIFACT" > "${CLI_ARTIFACT}.sha256"
          fi
          cat "${CLI_ARTIFACT}.sha256"

      - name: Upload CLI to release draft
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.CLI_ARTIFACT }}
            ${{ env.CLI_ARTIFACT }}.sha256
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true

  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download per-artifact checksums from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p checksums
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'acsm-*.sha256' \
            --dir checksums
          sort checksums/*.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Finalize notes and upload SHA256SUMS to draft release
        uses: softprops/action-gh-release@v3
        with:
          files: SHA256SUMS
          tag_name: ${{ github.ref_name }}
          name: "ACSM ${{ github.ref_name }}"
          body: |
            ## What's New

            ACSM is CLI-only. Build or install from the repository root with Cargo, without Node, Tauri, GTK or WebKit. The executable is `acsm`; rendering commands, configuration keys and output formats are retained. Previous configuration paths and environment variables are not read or migrated automatically.

            ### Requirements

            Install **ffmpeg** (including ffprobe) and **MediaInfo CLI** separately: `brew install ffmpeg-full mediainfo` (macOS), `winget install Gyan.FFmpeg MediaArea.MediaInfo` (Windows), or `apt install ffmpeg mediainfo` (Linux).

            ### Downloads and verification

            Download the `acsm-*` binary for your platform. Linux x86_64 has both the existing GNU build (`acsm-linux-x86_64`) and a static musl build (`acsm-linux-x86_64-musl`) for Alpine and other musl systems. Media tools are still separate runtime prerequisites (`apk add ffmpeg mediainfo` on Alpine). Verify the binary against `SHA256SUMS` before replacing your installed binary. Configuration uses `~/.acsm.toml` (override with `ACSM_CONFIG`).

            ### Notes

            The macOS universal CLI is Developer-ID signed and notarized. Windows CLI builds are unsigned; SmartScreen may warn on first run. Desktop installers and GUI auto-updates are no longer produced.

            ACSM is MIT-licensed. The embedded DejaVu Sans font retains its Bitstream/Arev notices; see `assets/fonts/LICENSE` in the source.
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
