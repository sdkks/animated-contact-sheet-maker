name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            cli-name: windows-x86_64
            cli-target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            rust-targets: aarch64-pc-windows-msvc
            cli-name: windows-aarch64
            cli-target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            cli-name: linux-x86_64
            cli-target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-musl
            cli-name: linux-x86_64-musl
            cli-target: x86_64-unknown-linux-musl

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.os }}-${{ matrix.cli-name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.os }}-${{ matrix.cli-name }}-

      - name: Install musl build tools
        if: matrix.cli-target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build acsm
        run: cargo build --locked --release --target ${{ matrix.cli-target }}

      - name: Strip CLI (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: strip target/${{ matrix.cli-target }}/release/acsm

      - name: Prepare CLI artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            src="target/${{ matrix.cli-target }}/release/acsm.exe"
            ext=".exe"
          else
            src="target/${{ matrix.cli-target }}/release/acsm"
            ext=""
          fi
          dst="acsm-${{ matrix.cli-name }}${ext}"
          cp "$src" "$dst"
          echo "CLI_ARTIFACT=$dst" >> "$GITHUB_ENV"

      - name: Verify musl static linkage and Alpine runtime
        if: matrix.cli-target == 'x86_64-unknown-linux-musl'
        run: |
          readelf -l "$CLI_ARTIFACT" > "$RUNNER_TEMP/program-headers.txt"
          readelf -d "$CLI_ARTIFACT" > "$RUNNER_TEMP/dynamic-section.txt"
          if grep -q INTERP "$RUNNER_TEMP/program-headers.txt" || grep -q NEEDED "$RUNNER_TEMP/dynamic-section.txt"; then
            echo 'musl CLI must not require a dynamic loader or shared libraries' >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/input:ro" alpine:3.19 sh -ec '
            /input/acsm-linux-x86_64-musl --help
            apk add --no-cache ffmpeg mediainfo
            export ACSM_CONFIG=/tmp/acsm.toml
            /input/acsm-linux-x86_64-musl probe /input/tests/fixtures/sample.mp4
            /input/acsm-linux-x86_64-musl sheet /input/tests/fixtures/sample.mp4 --cols 2 --rows 1 -o /tmp/smoke
            test -n "$(find /tmp/smoke -type f -size +0c)"
          '

      - name: Checksum CLI artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            sha=$(certutil -hashfile "$CLI_ARTIFACT" SHA256 | sed -n '2p' | tr -d ' \r' | tr '[:upper:]' '[:lower:]')
            printf '%s  %s\n' "$sha" "$CLI_ARTIFACT" > "${CLI_ARTIFACT}.sha256"
          else
            shasum -a 256 "$CLI_ARTIFACT" > "${CLI_ARTIFACT}.sha256"
          fi
          cat "${CLI_ARTIFACT}.sha256"

      - name: Upload CLI to release draft
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.CLI_ARTIFACT }}
            ${{ env.CLI_ARTIFACT }}.sha256
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true

  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download per-artifact checksums from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p checksums
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'acsm-*.sha256' \
            --dir checksums
          sort checksums/*.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Finalize notes and upload SHA256SUMS to draft release
        uses: softprops/action-gh-release@v3
        with:
          files: SHA256SUMS
          tag_name: ${{ github.ref_name }}
          name: "ACSM ${{ github.ref_name }}"
          body: |
            ## What's New

            ACSM is CLI-only. Build or install from the repository root with Cargo, without Node, Tauri, GTK or WebKit. The executable is `acsm`; rendering commands, configuration keys and output formats are retained. Previous configuration paths and environment variables are not read or migrated automatically.

            ### Requirements

            Install **ffmpeg** (including ffprobe) and **MediaInfo CLI** separately: `brew install ffmpeg-full mediainfo` (macOS), `winget install Gyan.FFmpeg MediaArea.MediaInfo` (Windows), or `apt install ffmpeg mediainfo` (Linux).

            ### Downloads and verification

            Download one of the four Windows or Linux binaries: `acsm-windows-x86_64.exe`, `acsm-windows-aarch64.exe`, `acsm-linux-x86_64` (GNU), or `acsm-linux-x86_64-musl` (static musl, for Alpine and other musl systems). Media tools are still separate runtime prerequisites (`apk add ffmpeg mediainfo` on Alpine). Verify the binary against `SHA256SUMS` before replacing your installed binary. Configuration uses `~/.acsm.toml` (override with `ACSM_CONFIG`).

            macOS is source-only: install Rust stable and a platform C linker, then run `cargo install --path . --locked` from the repository root, or `cargo install --git https://github.com/sdkks/animated-contact-sheet-maker.git --locked acsm`. No macOS binary is built by CI or attached to releases.

            ### Notes

            Windows CLI builds are unsigned; SmartScreen may warn on first run. Desktop installers and GUI auto-updates are no longer produced.

            ACSM is MIT-licensed. The embedded DejaVu Sans font retains its Bitstream/Arev notices; see `assets/fonts/LICENSE` in the source.
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
