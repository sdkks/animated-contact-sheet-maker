name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    # Relative reuse checks the tag commit, never an unrelated main-branch run.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate-tag:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against manifest and lockfile
        run: python3 scripts/verify-release.py tag "$GITHUB_REF_NAME"

  build:
    needs: [ci, validate-tag]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            cli-name: windows-x86_64
            cli-target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            rust-targets: aarch64-pc-windows-msvc
            cli-name: windows-aarch64
            cli-target: aarch64-pc-windows-msvc
          - os: ubuntu-26.04
            rust-targets: x86_64-unknown-linux-gnu
            cli-name: linux-x86_64
            cli-target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04
            rust-targets: x86_64-unknown-linux-musl
            cli-name: linux-x86_64-musl
            cli-target: x86_64-unknown-linux-musl

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.os }}-${{ matrix.cli-name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.os }}-${{ matrix.cli-name }}-

      - name: Install musl build tools
        if: matrix.cli-target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build acsm
        run: cargo build --locked --release --target ${{ matrix.cli-target }}

      - name: Strip CLI (Linux)
        if: matrix.os == 'ubuntu-26.04'
        run: strip target/${{ matrix.cli-target }}/release/acsm

      - name: Prepare CLI artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            src="target/${{ matrix.cli-target }}/release/acsm.exe"
            ext=".exe"
          else
            src="target/${{ matrix.cli-target }}/release/acsm"
            ext=""
          fi
          dst="acsm-${{ matrix.cli-name }}${ext}"
          cp "$src" "$dst"
          echo "CLI_ARTIFACT=$dst" >> "$GITHUB_ENV"

      - name: Verify musl static linkage and Alpine runtime
        if: matrix.cli-target == 'x86_64-unknown-linux-musl'
        run: |
          readelf -l "$CLI_ARTIFACT" > "$RUNNER_TEMP/program-headers.txt"
          readelf -d "$CLI_ARTIFACT" > "$RUNNER_TEMP/dynamic-section.txt"
          if grep -q INTERP "$RUNNER_TEMP/program-headers.txt" || grep -q NEEDED "$RUNNER_TEMP/dynamic-section.txt"; then
            echo 'musl CLI must not require a dynamic loader or shared libraries' >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/input:ro" alpine:3.19 sh -ec '
            /input/acsm-linux-x86_64-musl --help
            apk add --no-cache ffmpeg mediainfo
            export ACSM_CONFIG=/tmp/acsm.toml
            /input/acsm-linux-x86_64-musl probe /input/tests/fixtures/sample.mp4
            /input/acsm-linux-x86_64-musl sheet /input/tests/fixtures/sample.mp4 --cols 2 --rows 1 -o /tmp/smoke
            test -n "$(find /tmp/smoke -type f -size +0c)"
          '

      - name: Package CLI and checksum ZIP
        shell: bash
        run: bash scripts/package-release.sh "$CLI_ARTIFACT" "${{ matrix.cli-name }}" release-assets

      - name: Upload ZIP to release draft
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/acsm-${{ matrix.cli-name }}.zip
            release-assets/acsm-${{ matrix.cli-name }}.zip.sha256
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true

  finalize:
    needs: [ci, validate-tag, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify draft ZIPs and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          python3 scripts/verify-release.py archives release-assets

      - name: Finalize notes and upload SHA256SUMS to draft release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          name: "ACSM ${{ github.ref_name }}"
          body: |
            ## What's New

            ### Changed

            - Animated-sheet stitching now requests one video decoder thread per cached clip to reduce memory overhead. Quality, compression effort, and animation settings are unchanged.

            ### Requirements

            Install **ffmpeg** (including ffprobe) and **MediaInfo CLI** separately: `brew install ffmpeg-full mediainfo` (macOS), `winget install Gyan.FFmpeg MediaArea.MediaInfo` (Windows), or `apt install ffmpeg mediainfo` (Linux).

            ### Downloads and verification

            Download one of the four ZIP archives: `acsm-windows-x86_64.zip`, `acsm-windows-aarch64.zip`, `acsm-linux-x86_64.zip` (GNU), or `acsm-linux-x86_64-musl.zip` (static musl, for Alpine and other musl systems). Each contains `acsm` or `acsm.exe`, `LICENSE`, and `FONT-LICENSE`. Verify the ZIP against its `.zip.sha256` companion or `SHA256SUMS` before extracting and installing the binary. Media tools remain separate runtime prerequisites (`apk add ffmpeg mediainfo` on Alpine). Configuration uses `~/.acsm.toml` (override with `ACSM_CONFIG`).

            macOS is source-only: install Rust stable and a platform C linker, then run `cargo install --path . --locked` from the repository root, or `cargo install --git https://github.com/sdkks/animated-contact-sheet-maker.git --locked acsm`. No macOS binary is built by CI or attached to releases.

            ### Notes

            Windows CLI builds are unsigned; SmartScreen may warn on first run.

            ACSM is MIT-licensed (`LICENSE`). The embedded DejaVu Sans font retains its Bitstream/Arev notices in `FONT-LICENSE` (also `assets/fonts/LICENSE` in the source).
          draft: true
          prerelease: false
          fail_on_unmatched_files: true

      - name: Verify uploaded aggregate checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir uploaded
          cmp release-assets/SHA256SUMS uploaded/SHA256SUMS

      - name: Publish verified release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
