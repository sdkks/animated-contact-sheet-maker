[package]
name = "mosaic-cli"
version = "0.1.8"
edition = "2024"
description = "Command-line interface for Mosaic — video contact sheets, screenshots, animated previews, and probe metadata"
authors = ["Mosaic contributors"]
license = "MIT"
repository = "https://github.com/mosaicvideo/mosaic"
# Package only application inputs, not preserved caches from older layouts.
include = [
    "/Cargo.toml", "/Cargo.lock", "/.cargo/config.toml",
    "/src/**", "/tests/**", "/assets/fonts/**",
    "/LICENSE", "/README.md", "/CHANGELOG.md", "/CLAUDE.md", "/AGENT.md",
]

[lib]
name = "mosaic_lib"

[[bin]]
name = "mosaic-cli"
path = "src/main.rs"

[dependencies]
thiserror = "2"
which = "8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
indicatif = "0.18"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "signal", "time"] }
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
